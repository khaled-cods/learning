<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kataki Store</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#eef6fb;--ink:#0b2236;--mute:#53697a;--line:#dbe7f0;--grad:linear-gradient(100deg,#38bdf8,#7dd3fc);--nav:#0b2a43}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1620;--soft:#12212e;--ink:#eaf4fb;--mute:#9db4c4;--line:#22384a}}
:root[data-theme=dark]{--bg:#0b1620;--soft:#12212e;--ink:#eaf4fb;--mute:#9db4c4;--line:#22384a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,b,button{font-family:"Readex Pro",Tahoma,sans-serif}
button{cursor:pointer;border:0;font-size:1rem}
a{color:inherit}
:focus-visible{outline:3px solid #0284c7;outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--nav);color:#fff;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:1.1rem;margin-inline-end:6px}
.lg img{width:42px;height:42px;border-radius:50%}
.sp{flex:1}
.ib{background:rgba(255,255,255,.14);color:#fff;padding:6px 12px;border-radius:99px;text-decoration:none;white-space:nowrap}
.cartbtn,.add{background:var(--grad);background-size:200% 100%;color:#06283d;padding:9px 18px;border-radius:99px;font-weight:700;transition:background-position .4s}
.cartbtn:hover,.add:hover{background-position:100% 0}
.cartbtn b{background:#06283d;color:#fff;border-radius:99px;padding:0 8px;margin-inline-start:6px}
.wrap,main{max-width:1100px;margin:0 auto;padding:0 16px 48px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:36px 0}
.hero h1{font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.2;margin:0 0 12px;animation:rise .7s both}
.hero p{color:var(--mute);font-size:1.1rem;margin:0;animation:rise .7s .15s both}
.ring{position:relative;width:min(300px,70vw);aspect-ratio:1;margin:auto;animation:float 4.5s ease-in-out infinite}
.ring::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(#38bdf8,#bae6fd,#38bdf8);animation:spin 7s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px))}
.ring img{position:relative;width:100%;height:100%;border-radius:50%;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-12px)}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes bump{50%{transform:scale(1.6)}}@keyframes slide{from{transform:translateX(100%)}}
.bump{animation:bump .35s}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.bar h2{margin:0;margin-inline-end:auto}
.chip{background:var(--soft);color:var(--ink);padding:6px 16px;border-radius:99px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.p{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;animation:pop .5s calc(var(--i)*60ms) both;transition:transform .25s,box-shadow .25s}
.p:hover{transform:translateY(-6px);box-shadow:0 16px 30px rgba(2,132,199,.22)}
.dim{opacity:.5}
.art{background:#fff;aspect-ratio:1}
.art img{width:100%;height:100%;object-fit:contain;transition:transform .4s}
.p:hover .art img{transform:scale(1.07)}
.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info small,.note{color:var(--mute);font-size:.88rem}
.info h3{margin:0;font-size:1.02rem}
.price{font-weight:700}.price s{color:var(--mute);font-weight:400;font-size:.9rem}
.add:disabled{opacity:.5}
.info .add{margin-top:auto;border-radius:12px}
select,input,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto}
.drawer{position:fixed;inset:0;z-index:10;display:none}.drawer.open{display:block}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(440px,100%);background:var(--bg);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.drawer.open .panel{animation:slide .3s ease-out}
.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.row img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:8px}
.row>div:nth-child(2){flex:1}
.q{display:flex;gap:6px;align-items:center}
.q button{min-width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--ink);padding:0 8px}
.sum{display:flex;justify-content:space-between;gap:10px}
.sum.t{font-weight:700;font-size:1.1rem}
.pay label,.ck,.rt{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pay label{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rt input{width:110px}
.card2{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.card2 h3{margin:0}
.oc{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
.pv{width:90px;border-radius:8px;background:#fff}
.close{background:none;color:var(--mute);padding:4px 0;align-self:flex-start}
.msg{color:#d33;min-height:1.3em;font-size:.9rem}
.empty{color:var(--mute);text-align:center;padding:30px 0}
footer{background:var(--soft);text-align:center;padding:22px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mc{background:var(--soft);color:var(--ink);border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.mc:hover{transform:translateY(-3px)}.mc span{font-size:1.7rem}
.sr{flex:1;min-width:180px;display:flex;background:#fff;border-radius:10px;overflow:hidden}
.sr input{border:0;border-radius:0;background:#fff;color:#0b2236;flex:1;min-width:0}
.sr button{background:var(--grad);color:#06283d;padding:0 16px;border-radius:0}
.cats{background:#0e3a5c;display:flex;gap:6px;overflow-x:auto;padding:6px 16px}
.cats button{background:none;color:#fff;padding:4px 14px;border-radius:99px;white-space:nowrap}
.cats button[aria-pressed=true]{background:rgba(255,255,255,.22);font-weight:700}
.off{background:#e11d48;color:#fff;border-radius:6px;padding:0 6px;font-size:.8rem;font-weight:700}
.gbtn{background:#fff;color:#0b2236;border:1px solid var(--line);border-radius:99px;padding:10px;font-weight:700}
@media(max-width:760px){.sr{order:9;flex-basis:100%}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.ring{width:min(220px,60vw)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><a href="#/" class="lg"><img id="lgi" alt=""><b id="sn">Kataki Store</b></a><div class="sr"><input id="q" type="search" placeholder="ابحث عن منتج..." aria-label="بحث"><button data-act="search" aria-label="بحث">🔍</button></div><button class="ib" data-act="acc" id="acc">دخول</button><a class="ib" href="#/account">طلباتي</a><a class="ib" href="#/settings" aria-label="الإعدادات" title="الإعدادات" style="font-size:1.25rem;padding:3px 12px">⚙</a><button class="cartbtn" data-act="cart">🛒 <b id="cnt">0</b></button></header>
<div style="background:#bae6fd;color:#06283d;text-align:center;padding:6px 10px;font-size:.9rem">نسخة عرض تجريبية: البيانات محفوظة في متصفحك فقط. <button id="rst" style="background:#06283d;color:#fff;border-radius:99px;padding:2px 12px;font-size:.85rem">إعادة ضبط</button></div>
<nav class="cats" id="cats"></nav>
<main id="app"><p class="empty">جاري التحميل...</p></main>
<footer id="ft"></footer>
<div class="drawer" id="dr"><div class="shade" data-act="close"></div><div class="panel"></div></div>
<div class="drawer" id="md"><div class="shade" data-act="close"></div><div class="panel"></div></div>

function mockClient(u,k,opts){
 dbInit();
 const persist=!(opts&&opts.auth&&opts.auth.persistSession===false);
 const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
 const cur=()=>DB.users.find(u=>u.id===DB.sess),prof=()=>DB.profiles.find(p=>p.id===DB.sess);
 const adm=()=>["owner","staff"].includes(prof()?.role),own=()=>prof()?.role==="owner";
 const ok=d=>({data:d,error:null}),er=m=>({data:null,error:{message:m}});
 const sess=()=>{const u=cur();return u?{user:{id:u.id,email:u.email}}:null};
 function table(t){
  let op="select",flt=[],ord=null,lim=null,sing=false,pay=null;
  const q={select(){return q},insert(r){op="insert";pay=r;return q},update(r){op="update";pay=r;return q},upsert(r){op="upsert";pay=r;return q},delete(){op="delete";return q},
   eq(c,v){flt.push([c,v]);return q},order(c,o){ord=[c,!(o&&o.ascending===false)];return q},limit(n){lim=n;return q},single(){sing=true;return q},
   then(a,b){return Promise.resolve(run()).then(a,b)}};
  function run(){
   const T=DB[t],me=cur(),m=r=>flt.every(([c,v])=>r[c]==v);
   if(op==="select"){
    let r=T.filter(m);
    if(t==="products"&&!adm())r=r.filter(p=>!p.hidden);
    if(t==="orders"&&!adm())r=r.filter(o=>o.user_id===me?.id);
    if(t==="profiles"&&!adm())r=r.filter(p=>p.id===me?.id);
    if(ord)r=[...r].sort((a,b)=>(a[ord[0]]>b[ord[0]]?1:-1)*(ord[1]?1:-1));
    if(lim)r=r.slice(0,lim);
    r=JSON.parse(JSON.stringify(r));
    return sing?(r[0]?ok(r[0]):er("none")):ok(r);
   }
   if(!((t==="settings"||t==="shipping_rates")?own():adm()))return er("forbidden");
   if(op==="insert")T.push({id:++DB.seq[t],created_at:new Date().toISOString(),...pay});
   if(op==="update")T.filter(m).forEach(r=>Object.assign(r,pay));
   if(op==="delete")DB[t]=T.filter(r=>!m(r));
   if(op==="upsert")pay.forEach(p=>{const r=T.find(x=>x.governorate===p.governorate);r?Object.assign(r,p):T.push(p)});
   save();return ok(null);
  }
  return q;
 }
 return {
  from:table,
  auth:{
   async getSession(){return {data:{session:sess()}}},
   async signInWithPassword({email,password}){const u=DB.users.find(x=>x.email===email&&x.password===password);if(!u)return er("Invalid login");if(persist){DB.sess=u.id;save()}return ok({session:{user:{id:u.id,email:u.email}}})},
   async signUp({email,password,options}){
    if(DB.users.some(x=>x.email===email))return er("User already registered");
    const id="u"+Date.now()+Math.random().toString(36).slice(2,6);DB.users.push({id,email,password});
    DB.profiles.push({id,name:options?.data?.name||"",phone:options?.data?.phone||"",email,role:"customer"});
    if(persist)DB.sess=id;save();
    const s={user:{id,email}};return ok({user:s.user,session:s});
   },
   async signOut(){DB.sess=null;save();return ok(null)},

  async rpc(n,a){

   if(n==="place_order"){

     const p=DB.products.find(x=>x.id==it.id&&!x.hidden);

     lines.push([p,it]);sub+=p.price*it.qty;
    }

    const key={cod:"pay_cod",vodafone:"pay_vodafone",instapay:"pay_instapay"}[a.p_payment];if(!key||!st[key])return er("payment");
    let sh=r.price;const fs=+st.free_shipping_over||0;if(fs>0&&sub>=fs)sh=0;
    const snap=lines.map(([p,it])=>{p.sizes[it.size]-=it.qty;return{id:p.id,name:p.name,price:p.price,size:it.size,qty:it.qty}});
    const id=++DB.seq.orders;

    save();return ok(id);
   }
   if(n==="admin_set_status"){
    if(!adm())return er("forbidden");
    const o=DB.orders.find(x=>x.id==a.p_id);if(!o)return er("missing");
    const dead=s=>s==="ملغي"||s==="مرتجع";

    o.status=a.p_status;save();return ok(null);
   }
   return er("unknown");
  }
 };

function shrink(file){return new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(r,"image/jpeg",.82)};im.src=URL.createObjectURL(file)})}

  const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true,data:up?{name:nm,phone:ph}:{}}});
  if(error){m("تعذر إرسال الكود: "+error.message);return}
  S.pend={email:em};S.mode="code";$("#md .panel").innerHTML=authHtml();
 },
 async verify(){
  const {error}=await sb.auth.verifyOtp({email:S.pend.email,token:$("#uc").value.trim(),type:"email"});
  if(error){$("#um").textContent="الكود غلط أو انتهت صلاحيته.";return}
  S.mode="in";await afterAuth();
 },
 lang(id){try{localStorage.setItem("kl",id)}catch(e){}location.reload()},
 async logout(){await sb.auth.signOut();S.me=null;S.unlocked=false;S.ownerOpen=false;S.tab=null;location.hash="#/";render()},
 theme(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark"},
 async order(){await order()},
 ownerOpen(){S.ownerOpen=true;render()},
 async setup(){
  const hd=$("#ae").value.trim(),em=uid(hd),pw=$("#ap").value,code=$("#ac").value.trim();
  if(!okId(hd)){amsg("اسم الدخول حروف إنجليزي وأرقام (3 إلى 20).");return}
  if(!code||pw.length<10||pw!==$("#ap2").value){amsg("اكتب كود التفعيل، والباسورد 10 حروف على الأقل ويتطابق في الخانتين.");return}
  let {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{name:"المالك"}}});
  if(error&&/registered/i.test(error.message)){const s=await sb.auth.signInWithPassword({email:em,password:pw});if(s.error){amsg("اسم الدخول ده مستخدم قبل كده بباسورد تاني.");return}data=s.data;error=null}
  if(error){amsg("تعذر إنشاء الحساب: "+error.message);return}
  if(!data.session){amsg("لازم تعطّل تأكيد الإيميل في Supabase الأول (شوف README).");return}
  const r=await sb.rpc("claim_owner",{p_code:code});
  if(!r.data){await sb.auth.signOut();S.me=null;amsg("كود التفعيل غلط، أو المالك اتعمل قبل كده.");return}
  S.owner=true;await loadMe();S.unlocked=true;S.tab=null;render();
 },
 async alogin(){
  const {error}=await sb.auth.signInWithPassword({email:uid($("#ae").value),password:$("#ap").value});
  if(error){amsg("اسم الدخول أو الباسورد غلط.");return}
  await loadMe();if(isStaff()){S.unlocked=true;S.tab=null}render();
 },
 async unlock(){
  const {error}=await sb.auth.signInWithPassword({email:S.me.email,password:$("#ap").value});
  if(error){amsg("الباسورد غلط.");return}
  S.unlocked=true;S.tab=null;render();
 },
 lock(){S.unlocked=false;S.tab=null;render()},
 async addStaff(){
  const nm=$("#tn").value.trim(),hd=$("#te").value.trim(),pw=$("#tp").value;
  if(nm.length<2||!okId(hd)||pw.length<10){amsg("اكتب اسم الموظف واسم دخول (حروف إنجليزي وأرقام) وباسورد 10 حروف على الأقل.");return}
  const c2=mockClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const {data,error}=await c2.auth.signUp({email:uid(hd),password:pw,options:{data:{name:nm}}});
  if(error||!data.user){amsg(error&&/registered/i.test(error.message)?"اسم الدخول ده مستخدم قبل كده.":"تعذر إنشاء الحساب"+(error?": "+error.message:"."));return}
  const r=await sb.rpc("set_staff",{p_id:data.user.id});
  if(!r.data){amsg("اتعمل الحساب لكن تعذر ضمه للفريق.");return}
  render();
 },
 async rmStaff(id,b){if(!sure(b))return;await sb.rpc("remove_staff",{p_id:id});render()},
 tab(id){S.tab=id||null;S.edit=null;render()},
 pn(){S.edit={name:"",category:"حريمي",kind:"",price:"",old_price:"",img:"",sizes:{},hidden:false};render()},
 pe(id){S.edit={...S.prods.find(p=>p.id==id)};render()},
 px(){S.edit=null;render()},
 async ps(){await saveProd()},
 async ph(id){const p=S.prods.find(p=>p.id==id);await sb.from("products").update({hidden:!p.hidden}).eq("id",id);await reloadProds();render()},
 async pd(id,b){if(!sure(b))return;await sb.from("products").delete().eq("id",id);await reloadProds();render()},
 async ss(){await saveSettings()},
 async pw(){const v=$("#npw").value;if(v.length<10){amsg("الباسورد 10 حروف على الأقل.");return}const {error}=await sb.auth.updateUser({password:v});amsg(error?"تعذر تغيير الباسورد.":"");if(!error){$("#npw").value="";toast("تم تغيير الباسورد.")}}
};
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(b)await A[b.dataset.act]?.(b.dataset.id,b)});
document.addEventListener("change",async e=>{
 if(e.target.id==="gov")calc();
 if(e.target.dataset.st){
  const {error}=await sb.rpc("admin_set_status",{p_id:+e.target.dataset.st,p_status:e.target.value});
  if(error)toast("تعذر تغيير الحالة.");await reloadProds();render();
 }
});
$("#q").addEventListener("input",()=>{S.q=$("#q").value.trim();goShop()});
document.documentElement.lang=LANG;document.documentElement.dir=LANG==="en"?"ltr":"rtl";
if(LANG==="en"){trTree(document.body);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trTree))).observe(document.body,{childList:true,subtree:true})}
boot();
</script>
</body>
</html>
